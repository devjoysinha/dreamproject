# Limits are deliberately applied at the origin as a second line of defence
# when an edge rule is unavailable or bypassed.
limit_req_zone $binary_remote_addr zone=leakporns_api:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=leakporns_verify:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=leakporns_api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name leakporns.com www.leakporns.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://leakporns.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leakporns.com www.leakporns.com;

    # Install ops/nginx/cloudflare-realip.conf at this path. This accepts the
    # visitor address only when the connected peer is an official Cloudflare IP.
    include /etc/nginx/snippets/leakporns-cloudflare-realip.conf;

    ssl_certificate /etc/letsencrypt/live/leakporns.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leakporns.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        # Enough capacity for normal browsing, while making sequential catalog
        # harvesting slow and concurrent extraction impractical.
        limit_req zone=leakporns_api burst=45 nodelay;
        limit_conn leakporns_api_conn 10;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/verification {
        # A challenge is deliberately low-volume; this stops token-farming
        # attempts before the application contacts Turnstile.
        limit_req zone=leakporns_verify burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000/api/verification;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
