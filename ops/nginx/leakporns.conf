# Cloudflare is the only network allowed to reach this origin.  Trust
# CF-Connecting-IP only in that configuration, never on a public origin.
map $http_cf_connecting_ip $leakporns_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Limits are deliberately applied at the origin as a second line of defence
# when an edge rule is unavailable or bypassed.
limit_req_zone $leakporns_client_ip zone=leakporns_api:10m rate=3r/s;
limit_conn_zone $leakporns_client_ip zone=leakporns_api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name leakporns.com www.leakporns.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://leakporns.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leakporns.com www.leakporns.com;

    ssl_certificate /etc/letsencrypt/live/leakporns.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leakporns.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        # Enough capacity for normal browsing, while making sequential catalog
        # harvesting slow and concurrent extraction impractical.
        limit_req zone=leakporns_api burst=45 nodelay;
        limit_conn leakporns_api_conn 10;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $leakporns_client_ip;
        proxy_set_header X-Forwarded-For $leakporns_client_ip;
        proxy_set_header CF-Connecting-IP $leakporns_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $leakporns_client_ip;
        proxy_set_header X-Forwarded-For $leakporns_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
