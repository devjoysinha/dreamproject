name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-04948fa0dc13df18a \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters 'commands=[
              "set -e",
              "cd /opt/dreamproject",
              "sudo -u ec2-user git config --global --add safe.directory /opt/dreamproject",
              "sudo -u ec2-user git fetch origin",
              "sudo -u ec2-user git checkout main",
              "sudo -u ec2-user git pull origin main",
              "rm -rf /opt/dreamproject/Frontend/.next",
              "cd Frontend && sudo -u ec2-user npm run build",
              "systemctl restart dream-frontend",
              "systemctl restart dream-backend",
              "echo DEPLOY_OK"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-04948fa0dc13df18a \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "--- Deploy output ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-04948fa0dc13df18a \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "--- Deploy failed ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-04948fa0dc13df18a \
                --query '[StandardOutputContent,StandardErrorContent]' \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Deploy timed out waiting for SSM response"
          exit 1
